services:
  mysql:
    image: mysql:8.4
    container_name: eds-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: eds
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_USER: eds
      MYSQL_PASSWORD: dev
    volumes:
      - eds-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: eds-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  eds-mysql-data:
