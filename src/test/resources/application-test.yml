spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    enabled: true
  mail:
    host: localhost
    port: 3025

app:
  login-lock-attempts: 3
  login-lock-minutes: 30
  rate-limit-capacity: 1000

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: WARN
    ch.rasc: INFO
